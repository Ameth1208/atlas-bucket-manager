<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas Manager</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
</head>
<body class="bg-[#0f172a] min-h-screen">
    
    <!-- Navbar (from Pencil: h:64, glass) -->
    <nav class="bg-[#0f172ab3] backdrop-blur-xl border-b border-white/[0.08] sticky top-0 z-40">
        <div class="max-w-[1440px] mx-auto px-8 h-16 flex items-center justify-between">
            
            <!-- Logo -->
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-[#f43f5e] rounded-[8px] flex items-center justify-center">
                    <iconify-icon icon="ph:globe-hemisphere-west" class="text-[18px] text-white"></iconify-icon>
                </div>
                <div class="flex flex-col">
                    <span class="text-[14px] font-semibold text-[#f8fafc] leading-tight">Atlas</span>
                    <span class="text-[9px] font-medium text-[#64748b] uppercase tracking-wider">Manager</span>
                </div>
            </div>
            
            <!-- Search (w:320, h:36) -->
            <div class="hidden md:flex items-center gap-2 flex-1 max-w-md mx-8">
                <div class="relative flex-1">
                    <iconify-icon icon="ph:magnifying-glass" class="absolute left-3 top-1/2 -translate-y-1/2 text-[#ffffff66] text-[16px]"></iconify-icon>
                    <input 
                        type="text" 
                        id="globalSearch"
                        placeholder="Search..."
                        class="w-full h-9 pl-10 pr-3 bg-[#ffffff0f] rounded-[8px] text-[13px] text-[#f8fafc] placeholder:text-[#ffffff80]
                               focus:outline-none focus:ring-2 focus:ring-[#f43f5e]/20 transition-all"
                    />
                </div>
            </div>
            
            <!-- Actions -->
            <div class="flex items-center gap-2">
                <button id="themeToggle" class="w-8 h-8 flex items-center justify-center rounded-[6px] bg-[#ffffff0f] hover:bg-white/10 transition-colors">
                    <iconify-icon icon="ph:moon" class="hidden dark:block text-[18px] text-[#ffffff99]"></iconify-icon>
                    <iconify-icon icon="ph:sun" class="block dark:hidden text-[18px] text-[#ffffff99]"></iconify-icon>
                </button>
                <button id="logoutBtn" class="w-8 h-8 flex items-center justify-center rounded-[6px] bg-[#ffffff0f] hover:bg-red-500/10 hover:text-red-500 transition-colors">
                    <iconify-icon icon="ph:sign-out" class="text-[18px] text-[#ffffff99]"></iconify-icon>
                </button>
            </div>
        </div>
    </nav>
    
    <!-- Main Content -->
    <main class="max-w-[1440px] mx-auto px-8 py-8">
        
        <!-- Header -->
        <div class="flex items-center justify-between mb-8">
            <div>
                <h1 class="text-[24px] font-semibold text-[#f8fafc] tracking-tight">Storage Buckets</h1>
                <p class="text-[13px] text-[#64748b] mt-1">Manage visibility and lifecycle</p>
            </div>
            
            <!-- Create Button -->
            <button 
                id="createBucketBtn"
                class="h-11 px-6 bg-[#f43f5e] hover:bg-[#e11d48] text-white 
                       text-[14px] font-medium rounded-[8px] 
                       shadow-lg hover:shadow-xl hover:scale-[1.02] 
                       active:scale-[0.98] transition-all duration-300">
                Create Bucket
            </button>
        </div>
        
        <!-- Filters (from Pencil) -->
        <div class="flex gap-2 mb-8" id="filterContainer">
            <button class="filter-btn active h-9 px-4 rounded-[8px] text-[13px] font-medium 
                          bg-[#f43f5e] text-white whitespace-nowrap transition-all" data-provider="all">
                All
            </button>
            <button class="filter-btn h-9 px-4 rounded-[8px] text-[13px] font-medium 
                          bg-[#ffffff0f] text-[#cbd5e1] hover:text-[#f8fafc] whitespace-nowrap transition-all" data-provider="minio">
                MinIO
            </button>
            <button class="filter-btn h-9 px-4 rounded-[8px] text-[13px] font-medium 
                          bg-[#ffffff0f] text-[#cbd5e1] hover:text-[#f8fafc] whitespace-nowrap transition-all" data-provider="aws">
                AWS S3
            </button>
            <button class="filter-btn h-9 px-4 rounded-[8px] text-[13px] font-medium 
                          bg-[#ffffff0f] text-[#cbd5e1] hover:text-[#f8fafc] whitespace-nowrap transition-all" data-provider="r2">
                R2
            </button>
        </div>
        
        <!-- Loader -->
        <div id="loader" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="bg-[#1e293b] h-44 rounded-[16px] border border-[#334155] animate-pulse"></div>
            <div class="bg-[#1e293b] h-44 rounded-[16px] border border-[#334155] animate-pulse"></div>
            <div class="bg-[#1e293b] h-44 rounded-[16px] border border-[#334155] animate-pulse"></div>
        </div>
        
        <!-- Bucket Grid (from Pencil: gap:24) -->
        <div id="bucketList" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        
        <!-- Empty State -->
        <div id="emptyState" class="hidden flex flex-col items-center justify-center py-24 text-center">
            <iconify-icon icon="ph:cube-transparent" class="text-[56px] text-[#64748b] mb-4"></iconify-icon>
            <h3 class="text-[15px] font-medium text-[#cbd5e1] mb-2">No buckets</h3>
            <p class="text-[13px] text-[#64748b]">Create your first bucket to get started</p>
        </div>
    </main>
    
    <!-- Create Modal -->
    <div id="createModal" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" id="modalBackdrop"></div>
        <div class="relative bg-[#1e293b] rounded-[20px] p-8 max-w-md w-full shadow-2xl animate-modal-slide-up border border-white/[0.08]">
            <h3 class="text-xl font-semibold text-[#f8fafc] mb-2">Create New Bucket</h3>
            <p class="text-sm text-[#64748b] mb-6">Choose a provider and name</p>
            <form id="createBucketForm" class="space-y-5">
                <select id="createProvider" class="w-full h-11 px-4 bg-[#0f172a] rounded-[10px] border border-[#334155] text-[#f8fafc] focus:outline-none focus:border-[#f43f5e] transition-all">
                    <option value="minio">MinIO</option>
                    <option value="aws">AWS S3</option>
                    <option value="r2">Cloudflare R2</option>
                </select>
                <input type="text" id="createName" required placeholder="bucket-name" 
                       class="w-full h-11 px-4 bg-[#0f172a] rounded-[10px] border border-[#334155] text-[#f8fafc] placeholder:text-[#64748b] focus:outline-none focus:border-[#f43f5e] transition-all font-mono">
                <div class="flex justify-end gap-3 pt-4">
                    <button type="button" id="cancelCreate" class="h-9 px-5 bg-[#ffffff0f] text-[#f8fafc] text-sm font-medium rounded-pill hover:bg-white/20 transition-all">Cancel</button>
                    <button type="submit" class="h-9 px-5 bg-[#f43f5e] text-white text-sm font-medium rounded-pill hover:bg-[#e11d48] transition-all">Create</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Delete Modal -->
    <div id="deleteModal" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>
        <div class="relative bg-[#1e293b] rounded-[20px] p-8 max-w-md w-full shadow-2xl animate-modal-slide-up border border-white/[0.08]">
            <div class="w-12 h-12 bg-red-500/10 rounded-full flex items-center justify-center mb-4">
                <iconify-icon icon="ph:warning" class="text-2xl text-[#ff3b30]"></iconify-icon>
            </div>
            <h3 class="text-xl font-semibold text-[#f8fafc] mb-2">Delete Bucket?</h3>
            <p class="text-sm text-[#64748b] mb-6">This cannot be undone. Type bucket name to confirm.</p>
            <input type="text" id="deleteConfirm" class="w-full h-11 px-4 bg-[#0f172a] rounded-[10px] border border-[#334155] text-[#f8fafc] focus:outline-none focus:border-red-500 transition-all font-mono mb-6">
            <div class="flex justify-end gap-3">
                <button id="cancelDelete" class="h-9 px-5 bg-[#ffffff0f] text-[#f8fafc] text-sm font-medium rounded-pill hover:bg-white/20 transition-all">Cancel</button>
                <button id="confirmDelete" disabled class="h-9 px-5 bg-[#ff3b30] text-white text-sm font-medium rounded-pill hover:bg-red-600 transition-all disabled:opacity-50">Delete</button>
            </div>
        </div>
    </div>
    
    <!-- Toast -->
    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 z-[100] transform translate-y-20 opacity-0 transition-all duration-300">
        <div class="flex items-center gap-3 px-6 py-3 bg-[#1e293b] text-white rounded-[10px] shadow-2xl border border-white/[0.08]">
            <iconify-icon id="toastIcon" icon="ph:check-circle" class="text-lg text-[#34c759]"></iconify-icon>
            <span id="toastMessage" class="text-sm font-medium">Success!</span>
        </div>
    </div>
    
    <script type="module" src="/js/app.js"></script>
    <script>
        // Theme
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;
        html.classList.add('dark');
        themeToggle?.addEventListener('click', () => {
            html.classList.toggle('dark');
            localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
        });
        
        // Modals
        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        
        document.getElementById('createBucketBtn')?.addEventListener('click', () => openModal('createModal'));
        document.getElementById('cancelCreate')?.addEventListener('click', () => closeModal('createModal'));
        document.getElementById('modalBackdrop')?.addEventListener('click', () => { closeModal('createModal'); closeModal('deleteModal'); });
        
        // Delete confirm
        document.getElementById('deleteConfirm')?.addEventListener('input', (e) => {
            document.getElementById('confirmDelete').disabled = e.target.value !== store.deleteTarget?.name;
        });
    </script>
</body>
</html>
