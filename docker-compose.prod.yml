# Docker Compose - Production All-in-One (v2.0.2)
# Usage: docker compose -f docker-compose.prod.yml up -d

services:
  minio-manager:
    image: ghcr.io/ameth1208/atlas-bucket-manager:${IMAGE_TAG:-2.0.2}
    container_name: minio-manager
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-atlas-secure-key-change-me}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://manager.amethgm.com}
    volumes:
      - atlas_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  atlas_data:
    driver: local
