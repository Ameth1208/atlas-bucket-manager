services:
  # ── API Backend (NestJS + SQLite) ─────────────────────────────
  atlas-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: atlas-api:latest
    container_name: atlas-api
    expose:
      - "3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_PATH=/app/apps/api/data
      - CORS_ORIGIN=http://atlas-web:3000
    volumes:
      - atlas_api_data:/app/apps/api/data
      - atlas_api_uploads:/app/apps/api/uploads
      - atlas_api_temp:/app/apps/api/temp
    networks:
      - atlas-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Next.js Frontend ───────────────────────────────────────────
  atlas-web:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    image: atlas-web:latest
    container_name: atlas-web
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - API_URL=http://atlas-api:3001
    depends_on:
      atlas-api:
        condition: service_healthy
    networks:
      - atlas-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── MinIO (optional local S3 for development) ──────────────────
  minio-server:
    image: minio/minio:latest
    container_name: minio-server
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    networks:
      - atlas-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    profiles:
      - minio

volumes:
  atlas_api_data:
    driver: local
  atlas_api_uploads:
    driver: local
  atlas_api_temp:
    driver: local
  minio_data:
    driver: local

networks:
  atlas-net:
    driver: bridge
